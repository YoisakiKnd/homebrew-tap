name: Sync congminal release

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/sync-congminal.py
      - scripts/test-sync-congminal.py
      - .github/workflows/sync-congminal.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: homebrew-congminal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sync validation
        run: python3 scripts/test-sync-congminal.py
      - name: Verify the latest stable release and update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-congminal.py
      - name: Commit and test updated cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/congminal.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update congminal cask to $(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/congminal.rb)"
            # Other sync jobs may push to main in the same hour.
            git pull --rebase origin main
            git push origin HEAD:main
            # Pushes made with the workflow token do not start push-triggered workflows.
            gh workflow run test-congminal.yml --ref main
          fi
