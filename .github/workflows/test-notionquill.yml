name: Test NotionQuill cask

# 这份 cask 装不装得上，只有装了才知道 —— 所以每次改它就真在 macOS 上装一遍。
# （NotionQuill 主仓库是在 Linux 上开发的，这边是唯一能验证 cask 和 .app 的地方。）
#
# 读不到 job 日志的人（比如在 Linux 上维护这个 cask 的那个）靠两样东西看结果：
# 步骤名（哪一步挂了）和注解（那一步说了什么）。所以每一段检查都把关键事实
# 用 ::notice:: / ::error:: 抛出来。

on:
  push:
    paths:
      - Casks/notionquill.rb
      - scripts/check-cask.sh
      - .github/workflows/test-notionquill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install from the public tap
        run: |
          brew tap YoisakiKnd/tap
          brew install --cask YoisakiKnd/tap/notionquill

      - name: Where did the cask put the app
        run: |
          OUT=$(brew list --cask notionquill)
          printf '%s\n' "$OUT"
          MSG=$(printf '%s' "$OUT" | awk '{printf "%s%%0A", $0}')
          echo "::notice title=cask 装在哪::$MSG"

      - name: The installed app must match what the cask says
        run: |
          set -uo pipefail
          OUT=$(bash scripts/check-cask.sh 2>&1) && rc=0 || rc=$?
          printf '%s\n' "$OUT"
          # 注解里换行写成 %0A；用 awk 拼，别用 sed 的多行语法（BSD sed 不吃）
          MSG=$(printf '%s' "$OUT" | tail -25 | awk '{printf "%s%%0A", $0}')
          if [ "$rc" -ne 0 ]; then
            echo "::error title=cask 检查没通过::$MSG"
            exit 1
          fi
          echo "::notice title=cask 检查通过::$MSG"

      - name: Report what Homebrew recorded
        run: brew info --cask YoisakiKnd/tap/notionquill | head -20